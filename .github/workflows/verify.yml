name: verify

on:
  pull_request:
    # edited: PR の本文（対象要件）を直したときもやり直す
    types: [opened, synchronize, reopened, edited]
  push:
    # 統合に使うブランチ。案件の運用（develop・release など）に合わせて足す
    branches: [main, master, develop, 'release/**']

permissions:
  contents: read
  pull-requests: read   # Lint が PR の今の本文を読むため

jobs:
  harness:
    name: ハーネス（Lint・hooks）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # PR では向き先のブランチと比べて、消えた行IDを見つけるため
      - name: Excel を読む準備（ID 設計の原本）
        run: pip install openpyxl
      - name: Lint（共通＋業務固有）
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_BODY: ${{ github.event.pull_request.body }}
          TAZUNA_IS_PR: ${{ github.event_name == 'pull_request' && '1' || '' }}
          DESIGN_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          # PR の本文は、起動した時点のものではなく今のものを読む（承認待ちの後に流したとき、エージェントが本文を書き換えた後など）
          if [ -n "$PR_NUMBER" ]; then
            TAZUNA_PR_BODY=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq .body 2>/dev/null) || TAZUNA_PR_BODY="$EVENT_BODY"
            export TAZUNA_PR_BODY
          fi
          bash scripts/lint/run-all.sh
      - name: hooks の自己テスト
        run: bash .github/hooks/tests/test-guard.sh
      - name: Lint の自己テスト（ID 設計書）
        run: bash scripts/lint/tests/test-design-docs.sh
      - name: 転記ツールの自己テスト
        run: bash scripts/lint/tests/test-design-transcribe.sh
      - name: ID 設計のコマンドの自己テスト
        run: bash scripts/lint/tests/test-id-design.sh
      - name: Lint の自己テスト（DDL の説明）
        run: bash scripts/lint/tests/test-ddl-comments.sh
      - name: Lint の自己テスト（要件とテストの対応）
        run: bash scripts/lint/tests/test-requirement-traceability.sh
      - name: レポートの自己テスト
        run: bash scripts/lint/tests/test-report.sh
      - name: 案内役の自己テスト
        run: bash scripts/lint/tests/test-next.sh

  build:
    name: ビルドとテスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: mvn verify（単体テスト・ArchUnit）
        run: mvn -B verify
      - name: テストの結果を残す（PR レポートが読む）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  report:
    name: PR レポート
    # PR に、対象要件のテスト仕様の行・作業一覧の未対応・テストと Lint の結果をコメントする（scripts/report/report.py）
    if: always() && github.event_name == 'pull_request'
    needs: [harness, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: surefire-reports
          path: surefire-reports
        continue-on-error: true
      - name: レポートを作ってコメントする
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: origin/${{ github.base_ref }}
          LINT: ${{ needs.harness.result == 'success' && 'ok' || 'ng' }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq .body > pr-body.md
          python3 scripts/report/report.py pr --base "$BASE_REF" --body-file pr-body.md --surefire surefire-reports --lint "$LINT" > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          # 同じコメントを更新する（PR に何度も足さない）
          { echo '<!-- tazuna:pr-report -->'; cat report.md; } > comment.md
          id=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" --paginate --jq '.[] | select(.body | startswith("<!-- tazuna:pr-report -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" -F body=@comment.md > /dev/null
          fi
