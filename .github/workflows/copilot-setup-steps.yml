# GitHub 上の Copilot（クラウドエージェント）が作業を始める前に、作業環境を用意する。
# エージェントの作業中は外部への通信が GitHub と Copilot の宛先に絞られるため、
# Maven の依存ライブラリやプラグイン、Lint とツールが使う Python のライブラリはここで先に取っておく。
# ジョブ名は copilot-setup-steps でなければ使われない。このファイルを変えたときは、PR で下の push / pull_request が試しに動く。
name: Copilot の作業環境の準備

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 進捗・Lint が比べ先のブランチの履歴を使う

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'   # pom.xml の maven.compiler.release と合わせる
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python のライブラリ（ID 設計のツールが Excel を読む）
        run: pip install openpyxl

      - name: Maven の依存ライブラリとプラグインを取っておく
        # プラグインは版まで指定する（短い名前 dependency: は、取得に失敗したとき「プラグインが見つからない」になる）。
        # Maven Central への取得が一時的に失敗することがあるので、3回まで取り直す。
        # テストまで一度動かして、テスト実行用のプラグインも取る。ここではテストの失敗と、単体のゲート
        # （分岐カバレッジ・ミューテーション・セキュリティの静的解析）の基準割れでは止めない（プラグインを取るのが目的）
        run: |
          for i in 1 2 3; do
            mvn -B -q org.apache.maven.plugins:maven-dependency-plugin:3.8.1:go-offline \
              && mvn -B -q verify -Dmaven.test.failure.ignore=true -Djacoco.haltOnFailure=false \
                   -Dtazuna.mutation.min=0 -Dspotbugs.failOnError=false && exit 0
            echo "Maven の取得に失敗しました（${i} 回目）。30秒後に取り直します"; sleep 30
          done
          exit 1
